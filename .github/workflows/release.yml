name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  release:
    needs: verify
    # Run on this fork. GoReleaser publishes the CLI binaries to the public
    # jamshidtulaganov/agora-cli distribution repo (see .goreleaser.yml release:).
    if: github.repository_owner == 'jamshidtulaganov'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # PAT with contents:write on jamshidtulaganov/agora-cli (the release
          # target). The default GITHUB_TOKEN only has access to THIS repo, not
          # the separate public distribution repo.
          GITHUB_TOKEN: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}

  # The source repository is private, while the one-line installers must stay
  # publicly readable. Keep the root scripts in our public distribution repo
  # in lockstep with every verified release tag.
  sync-public-installers:
    needs: verify
    if: github.repository_owner == 'jamshidtulaganov'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agora source
        uses: actions/checkout@v4

      - name: Checkout public distribution repo
        uses: actions/checkout@v4
        with:
          repository: jamshidtulaganov/agora-cli
          token: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}
          path: public-distribution

      - name: Sync public installers
        shell: bash
        run: |
          cp scripts/install.sh public-distribution/install.sh
          cp scripts/install.ps1 public-distribution/install.ps1
          chmod +x public-distribution/install.sh

          cd public-distribution
          git config user.name "agora-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add install.sh install.ps1
          if git diff --cached --quiet; then
            echo "Public installers are already current."
            exit 0
          fi
          git commit -m "chore: sync installers for ${{ needs.verify.outputs.tag_name }}"
          git push origin HEAD:main

  # Multi-arch images are built natively per platform on dedicated runners
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and merged into a
  # manifest list. This avoids QEMU emulation, which was making the Next.js
  # arm64 build run for 30+ minutes per release.
  docker-backend-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-backend
          labels: |
            org.opencontainers.image.title=Agora Backend
            org.opencontainers.image.description=Agora self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/agora-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/agora-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/agora-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-web
          labels: |
            org.opencontainers.image.title=Agora Web
            org.opencontainers.image.description=Agora self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/agora-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agora-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/agora-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/agora-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository_owner == 'jamshidtulaganov'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/agora
      OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push ".chart-packages/agora-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/agora" --version "$CHART_VERSION"

  # Build the Desktop installers for Linux and Windows and upload them to
  # the GitHub Release that the `release` job above just published. macOS is
  # built separately by `desktop-mac` below, because it is the one platform
  # whose auto-update hard-requires a real code signature.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}
          # Disable code signing on Linux/Windows for now — the public
          # release is unsigned for these platforms, the CLI carries the
          # trust boundary. Set CSC_LINK in repo secrets to enable
          # Windows signing later.
          #
          # This matrix is Linux + Windows ONLY, and this variable must never
          # reach a macOS build: it forces an ad-hoc signature, whose designated
          # requirement is a bare cdhash of that exact binary. Squirrel.Mac then
          # rejects every subsequent version, so "Restart now" silently does
          # nothing forever — and the broken updater is the very thing that
          # would have shipped the fix. Unsigned auto-update is fine here only
          # because Windows skips verification when no publisherName is present
          # (NsisUpdater.verifySignature) and Linux never verifies at all.
          # macOS is built by `desktop-mac` below, without this variable.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish always

  # `secrets` is not available in a job-level `if:`, so resolve the signing
  # config into a plain output here and gate the macOS job on that. Doing it in
  # a separate (cheap, Linux) job keeps `desktop-mac` from spinning up an
  # expensive macOS runner only to skip.
  desktop-mac-gate:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      signing_configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for Developer ID signing secrets
        id: check
        # `${!name}` is a bash indirect expansion; pin the shell rather than
        # relying on the runner default.
        shell: bash
        # Checks every secret the mac build actually needs, and names the
        # missing ones. A partial config would otherwise pass a laxer gate and
        # then die ~20 minutes into a macOS build at the notarization step.
        # CSC_KEY_PASSWORD is intentionally not required: a .p12 exported
        # without a password is legal.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in CSC_LINK APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All Developer ID signing secrets present — building macOS Desktop."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS Desktop not built::No macOS artifacts were published for this release. Missing repo secrets:${missing}. See the desktop-mac job in this workflow for how to obtain them."
          fi

  # Build, sign, notarize and publish the macOS Desktop app.
  #
  # Separate from the `desktop` matrix above for three reasons: it needs the
  # Apple secrets, it must NOT inherit that job's CSC_IDENTITY_AUTO_DISCOVERY=false,
  # and it runs on a macOS runner (codesign/notarytool are macOS-only).
  #
  # Required repo secrets — until all are set the job is skipped, so releases
  # stay green while the Apple Developer enrollment is pending:
  #   CSC_LINK                    base64 of the exported Developer ID .p12
  #                               (`base64 -i cert.p12 | pbcopy`)
  #   CSC_KEY_PASSWORD            the .p12 export password
  #   APPLE_ID                    Apple ID used for notarization
  #   APPLE_APP_SPECIFIC_PASSWORD app-specific password from appleid.apple.com
  #   APPLE_TEAM_ID               10-char Team ID from the Membership page
  #
  # electron-builder imports CSC_LINK into a temporary keychain itself, so no
  # manual `security create-keychain` dance is needed here.
  #
  # arm64 only, matching what we ship today. Adding Intel is NOT just another
  # arch flag: electron-builder does not arch-suffix `latest-mac.yml`, so a
  # second mac invocation would overwrite the first one's update metadata —
  # the same collision `builderArgsForTarget` already works around for Windows
  # arm64, and it would need the same explicit channel treatment.
  desktop-mac:
    needs: [release, desktop-mac-gate]
    if: needs.desktop-mac-gate.outputs.signing_configured == 'true'
    runs-on: macos-latest
    # Notarization waits on Apple's service. Cap it so a hung submission cannot
    # burn hours of (10x-priced) macOS runner time.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # package.mjs derives the version from `git describe --tags`.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package, sign, notarize and publish Desktop (macOS arm64)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.AGORA_CLI_RELEASE_TOKEN }}
          # Signing identity. Deliberately no CSC_IDENTITY_AUTO_DISCOVERY here —
          # setting it to "false" is what produced the ad-hoc builds that cannot
          # auto-update. package.mjs refuses to publish a mac target if it is set.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization (electron-builder.yml sets `notarize: true`).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/package.mjs --mac --arm64 --publish always

      # package.mjs already fails the build on an ad-hoc/unsigned bundle. These
      # checks cover what it cannot: that notarization actually stapled, and
      # that the asar is not corrupt (three separate local mac builds have
      # shipped a corrupt app.asar, which exits 1 with no output at all).
      #
      # electron-builder uploads as it builds, so a failure here means the bad
      # assets are already attached to the release — delete them from the
      # release before anyone downloads, then re-run.
      - name: Verify notarization and asar integrity
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/dist/mac-arm64/Agora.app"
          ASAR="$APP/Contents/Resources/app.asar"

          echo "--- Gatekeeper assessment ---"
          spctl -a -t exec -vv "$APP"

          echo "--- Stapled notarization ticket ---"
          xcrun stapler validate "$APP"

          # Reading package.json back out exercises the archive's header
          # offsets, which is exactly what corrupts. Uses @electron/asar's Node
          # API (returns a Buffer, writes nothing) rather than its `extract-file`
          # CLI, which would dump package.json into the working directory and
          # clobber apps/desktop/package.json. Same @electron/asar version that
          # electron-builder used to write the archive, so a version skew cannot
          # mask a corrupt one.
          echo "--- asar integrity ---"
          node -e '
            const asar = require("@electron/asar");
            const raw = asar.extractFile(process.argv[1], "package.json");
            const p = JSON.parse(raw.toString("utf8"));
            console.log("app.asar OK — " + p.productName + " " + p.version);
          ' "$ASAR"
