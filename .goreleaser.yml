version: 2

project_name: agora

# Source repo (jamshidtulaganov/agora) is PRIVATE, so the CLI release can't live
# on its own releases page (it would be private too). Publish to the PUBLIC
# distribution repo instead — multica releases to its own (public) repo; this is
# the only adaptation needed for a private source.
release:
  github:
    owner: jamshidtulaganov
    name: agora-cli

builds:
  - id: agora
    main: ./cmd/agora
    dir: server
    binary: agora
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive name kept so already-released CLIs (whose `agora update`
  # looks for `agora_{os}_{arch}.{ext}`) can keep self-updating. Remove
  # once those versions are no longer in use.
  - id: legacy
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew tap disabled — agora-ai/homebrew-tap isn't ours. Distribution is via
# the public agora-cli repo's release binaries (curl install.sh). To add
# `brew install` later, create your own tap repo and re-add a `brews:` block
# pointing at it (with a PAT in HOMEBREW_TAP_GITHUB_TOKEN).
