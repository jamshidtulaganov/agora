# Local dev/test only: expose the (otherwise internal-only) selfhost Postgres on
# a host port so `go test` can reach the already-migrated DB at
# postgres://multica:multica@localhost:5433/multica. Auto-loaded by
# `docker compose` only when passed explicitly with -f alongside the selfhost
# file; production self-host never uses this override.
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  # SD fork: inject Telegram bot-OTP env into the backend container. The
  # upstream selfhost compose's backend.environment block does not list these,
  # so they would not reach os.Getenv inside the container without this merge.
  backend:
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Agora: lock to 3 workspaces + Telegram-only registration
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      AGORA_TELEGRAM_ONLY: ${AGORA_TELEGRAM_ONLY:-}
      AGORA_DEFAULT_WORKSPACE_SLUGS: ${AGORA_DEFAULT_WORKSPACE_SLUGS:-}
      # Bitrix24 sync
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_SYNC_WORKSPACE_SLUG: ${BITRIX_SYNC_WORKSPACE_SLUG:-}
      BITRIX_GROUP_MAP: ${BITRIX_GROUP_MAP:-}
      BITRIX_INBOUND_SECRET: ${BITRIX_INBOUND_SECRET:-}
      BITRIX_PUSH_STATUS: ${BITRIX_PUSH_STATUS:-}
