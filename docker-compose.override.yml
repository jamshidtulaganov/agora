# Local dev/test only: expose the (otherwise internal-only) selfhost Postgres on
# a host port so `go test` can reach the already-migrated DB at
# postgres://agora:agora@localhost:5433/agora. Auto-loaded by
# `docker compose` only when passed explicitly with -f alongside the selfhost
# file; production self-host never uses this override.
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  # SD fork: inject Telegram bot-OTP env into the backend container. The
  # upstream selfhost compose's backend.environment block does not list these,
  # so they would not reach os.Getenv inside the container without this merge.
  backend:
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Agora: lock to 3 workspaces + Telegram-only registration
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      AGORA_TELEGRAM_ONLY: ${AGORA_TELEGRAM_ONLY:-}
      AGORA_DEFAULT_WORKSPACE_SLUGS: ${AGORA_DEFAULT_WORKSPACE_SLUGS:-}
      # Bitrix24 sync
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_SYNC_WORKSPACE_SLUG: ${BITRIX_SYNC_WORKSPACE_SLUG:-}
      BITRIX_GROUP_MAP: ${BITRIX_GROUP_MAP:-}
      BITRIX_INBOUND_SECRET: ${BITRIX_INBOUND_SECRET:-}
      BITRIX_PUSH_STATUS: ${BITRIX_PUSH_STATUS:-}
      # Restrict Bitrix member provisioning to a department (Отдел), comma-
      # separated names — e.g. "SD Разработка". Empty = provision every
      # responsible (pre-department behaviour).
      BITRIX_TEAM_DEPARTMENTS: ${BITRIX_TEAM_DEPARTMENTS:-}
      # Zoho Projects importer (Phase 1 one-way import + Phase 2 sync/status)
      ZOHO_PROJECTS_CLIENT_ID: ${ZOHO_PROJECTS_CLIENT_ID:-}
      ZOHO_PROJECTS_CLIENT_SECRET: ${ZOHO_PROJECTS_CLIENT_SECRET:-}
      ZOHO_PROJECTS_REFRESH_TOKEN: ${ZOHO_PROJECTS_REFRESH_TOKEN:-}
      ZOHO_PROJECTS_PORTAL: ${ZOHO_PROJECTS_PORTAL:-}
      ZOHO_PROJECTS_PUSH_STATUS: ${ZOHO_PROJECTS_PUSH_STATUS:-}
      ZOHO_PROJECTS_SYNC_INTERVAL: ${ZOHO_PROJECTS_SYNC_INTERVAL:-}
      ZOHO_PROJECTS_ACCOUNTS_HOST: ${ZOHO_PROJECTS_ACCOUNTS_HOST:-}
      ZOHO_PROJECTS_API_HOST: ${ZOHO_PROJECTS_API_HOST:-}
      # Zoho Sprints importer (separate product/API)
      ZOHO_SPRINTS_CLIENT_ID: ${ZOHO_SPRINTS_CLIENT_ID:-}
      ZOHO_SPRINTS_CLIENT_SECRET: ${ZOHO_SPRINTS_CLIENT_SECRET:-}
      ZOHO_SPRINTS_REFRESH_TOKEN: ${ZOHO_SPRINTS_REFRESH_TOKEN:-}
      ZOHO_SPRINTS_TEAM: ${ZOHO_SPRINTS_TEAM:-}
      ZOHO_SPRINTS_ACCOUNTS_HOST: ${ZOHO_SPRINTS_ACCOUNTS_HOST:-}
      ZOHO_SPRINTS_API_HOST: ${ZOHO_SPRINTS_API_HOST:-}
      # SD QA boxes: SSH git-sync (deploy-qa) to remote SalesDoctor target boxes.
      # Backend SSHes into the box with AGORA_REMOTE_BOXES_SSH_KEY and fetches the
      # PR branch with AGORA_REMOTE_BOXES_GIT_TOKEN injected ephemerally (never set-url'd).
      AGORA_REMOTE_BOXES_ENABLED: ${AGORA_REMOTE_BOXES_ENABLED:-}
      AGORA_REMOTE_BOXES_SSH_KEY: ${AGORA_REMOTE_BOXES_SSH_KEY:-}
      AGORA_REMOTE_BOXES_GIT_TOKEN: ${AGORA_REMOTE_BOXES_GIT_TOKEN:-}
      # QA-team automation: auto-fire the QA squad's run_qa when an issue enters
      # in_review (and auto_docs on qa:pass). Opt-in, default off.
      AGORA_AUTO_QA_ENABLED: ${AGORA_AUTO_QA_ENABLED:-}
      AGORA_AUTO_DOCS_ENABLED: ${AGORA_AUTO_DOCS_ENABLED:-}
      # Compiled QA scripts: background-compile a human-authored automated test
      # case into a runnable Playwright script on create. Opt-in, default off.
      AGORA_QA_COMPILE_ENABLED: ${AGORA_QA_COMPILE_ENABLED:-}
      # qa:fail -> reassign to the failing dev agent's squad lead. Opt-in.
      AGORA_QA_FAIL_AUTOROUTE_ENABLED: ${AGORA_QA_FAIL_AUTOROUTE_ENABLED:-}
      # Structural QA gate: squad-orchestrated issues can't skip in_review to
      # done without qa:pass — direct done is redirected to in_review. Opt-in.
      AGORA_QA_GATE_ENFORCED: ${AGORA_QA_GATE_ENFORCED:-}
      # Design gate: a design-decomposed issue can't reach done without a
      # passing/skipped design verdict (or a qa:pass override). Opt-in, dark.
      AGORA_DESIGN_GATE_ENFORCED: ${AGORA_DESIGN_GATE_ENFORCED:-}
      # Re-wake the squad lead when a delegated member task dies, so an
      # orchestrated issue doesn't wedge with no recovery. Opt-in.
      AGORA_SQUAD_FAILURE_RECOVERY_ENABLED: ${AGORA_SQUAD_FAILURE_RECOVERY_ENABLED:-}
      # Sprint-worktree: N tasks share one sprint git branch instead of forking
      # per-task branches. Opt-in, default off — see docs/sprint-worktree-design.md.
      AGORA_SPRINT_WORKTREE_ENABLED: ${AGORA_SPRINT_WORKTREE_ENABLED:-}
      # Branch names a sprint may NOT use as its integration branch (comma list).
      # "billing" is SalesDoctor's PROD branch; a sprint pointed at it would make
      # agents commit onto + QA deploy production. master/main/production/prod are
      # always rejected as a backstop even when this is empty.
      AGORA_PROTECTED_SPRINT_BRANCHES: ${AGORA_PROTECTED_SPRINT_BRANCHES:-billing}
      # QA host: the shared parent server per-developer QA boxes are carved out of
      # as wildcard subdomains (<handle>.<base-domain>). The provisioner reuses
      # the remote-boxes SSH key + git token above; the DB clone uses the box's
      # own local mysql auth, so no DB password is passed here.
      AGORA_QA_HOST_SSH_HOST: ${AGORA_QA_HOST_SSH_HOST:-}
      AGORA_QA_HOST_SSH_USER: ${AGORA_QA_HOST_SSH_USER:-}
      AGORA_QA_HOST_SSH_PORT: ${AGORA_QA_HOST_SSH_PORT:-}
      AGORA_QA_HOST_BASE_DOMAIN: ${AGORA_QA_HOST_BASE_DOMAIN:-}
      AGORA_QA_HOST_WEB_ROOT: ${AGORA_QA_HOST_WEB_ROOT:-}
      AGORA_QA_HOST_REPO_URL: ${AGORA_QA_HOST_REPO_URL:-}
      AGORA_QA_HOST_SEED_DIR: ${AGORA_QA_HOST_SEED_DIR:-}
      AGORA_QA_HOST_SEED_DB: ${AGORA_QA_HOST_SEED_DB:-}
    volumes:
      # Control-plane private key (read-only) the backend uses to reach the QA
      # boxes over SSH; in-container path must match AGORA_REMOTE_BOXES_SSH_KEY.
      - ${AGORA_REMOTE_BOXES_SSH_KEY_HOST:-/Users/jamshid/.ssh/agora_remote_boxes}:/keys/agora_remote_boxes:ro
