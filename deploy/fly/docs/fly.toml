# sd-agora-docs — the documentation site (Next.js + Fumadocs, standalone).
# Public so the fly proxy handles connectivity; the canonical entry point is
# still the web app, which reverse-proxies /docs/:path* here via its DOCS_URL
# rewrite (visiting this host directly just redirects / to /docs).
#
# Build context MUST be the repo root. Deploy from repo root:
#
#   fly deploy --config deploy/fly/docs/fly.toml --dockerfile Dockerfile.docs .

app = "sd-agora-docs"
primary_region = "fra"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Must be "::", not "0.0.0.0". The web app reaches us over 6PN
  # (sd-agora-docs.internal), and Fly's private network is IPv6-only — a
  # Next.js standalone server bound to 0.0.0.0 listens on IPv4 only, so every
  # 6PN connection gets ECONNREFUSED even though the machine is healthy and
  # the public fly.dev hostname serves fine. sd-agora-backend does not need
  # this because Go's default listener is already dual-stack.
  HOSTNAME = "::"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
