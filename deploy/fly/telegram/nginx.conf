# sd-agora-tg nginx: serves the Telegram Mini App SPA and reverse-proxies its
# API/WS/auth/uploads to the private Go backend over Fly's 6PN network. The
# backend has no public IP, so this proxy is what makes the SPA same-origin with
# its API (no CORS) and lets the Authorization: Bearer JWT flow straight through.

# Fly's internal DNS. Resolve the .internal upstream at request time (via a
# variable) so nginx still boots if the backend is briefly unavailable.
resolver [fdaa::3]:53 valid=5s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS/CSS bundle.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WebSocket: realtime updates. Must come before the generic / fallback.
    location = /ws {
        set $backend "sd-agora-backend.internal:8080";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $backend "sd-agora-backend.internal:8080";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        set $backend "sd-agora-backend.internal:8080";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend "sd-agora-backend.internal:8080";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every other path serves index.html (client routing).
    # index.html must NEVER be cached — it points at the hashed asset bundle, so
    # a cached copy pins the Telegram webview to a stale app forever (updates
    # silently don't apply). Assets are immutable+hashed, so only this needs it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
