# sd-agora-backend — Go API (Chi + sqlc + websocket). Private, 6PN only.
# Reached by the web app at: sd-agora-backend.internal:8080  (no public IP).
# Entrypoint runs `migrate up` then `server` on every boot.
#
# Build context MUST be the repo root (the Dockerfile copies server/), so deploy
# from the repo root with an explicit --dockerfile:
#
#   fly deploy --config deploy/fly/backend/fly.toml --dockerfile Dockerfile .
#
# Secrets (set once, never commit) — see deploy/fly/secrets.example.env:
#   DATABASE_URL JWT_SECRET SMTP_PASSWORD GOOGLE_CLIENT_SECRET

app = "sd-agora-backend"
primary_region = "fra"

# Local attachment storage (used when S3_* is unset). Single machine only.
[mounts]
  source = "agora_uploads"
  destination = "/app/data/uploads"

[env]
  PORT = "8080"
  APP_ENV = "production"
  ALLOW_SIGNUP = "true"
  # Login page offers Telegram only (email/password form hidden) — the team
  # authenticates through @agora_ai_pm_bot; flip to "false" to restore email.
  AGORA_TELEGRAM_ONLY = "true"

  # Public URLs all point at the web app (the only public surface). The backend
  # is reached through the web app's same-origin /api, /ws, /auth, /uploads proxy.
  FRONTEND_ORIGIN = "https://sd-agora-web.fly.dev"
  AGORA_APP_URL = "https://sd-agora-web.fly.dev"
  AGORA_PUBLIC_URL = "https://sd-agora-web.fly.dev"

  # Live code editor — cloud mode: when set, the backend launches + reverse-
  # proxies code-server on the remote daemon over 6PN (the browser can't reach
  # the daemon's 127.0.0.1). Unset on self-host (browser launches directly).
  AGORA_DAEMON_INTERNAL = "sd-agora-daemon.internal:19514"

  # Telegram bot-OTP login. Token + webhook secret are fly secrets.
  TELEGRAM_BOT_USERNAME = "agora_ai_pm_bot"

  # Bitrix24 sync — Sales Doctor (sd-main) only. Webhook URL + inbound secret
  # are fly secrets; the routing below is plain env.
  BITRIX_SYNC_WORKSPACE_SLUG = "sd-main"
  BITRIX_GROUP_MAP = "153:sd-main"
  # Safety-net poll: re-sync tracked Bitrix tasks (status/stage/comments/
  # attachments) every interval so imported issues stay live even if a webhook
  # is missed. Empty/invalid/<=0 disables it — sync then rides webhooks alone.
  BITRIX_SYNC_POLL_INTERVAL = "5m"

  # A sprint's integration branch may never be one of these. "billing" is
  # SalesDoctor's PROD branch — a sprint pointed at it would make agents commit
  # onto, and QA deploy, production. Sprints get a dedicated branch cut off prod;
  # a human merges it back at sprint end. master/main/production/prod are always
  # rejected as a backstop even without this list.
  AGORA_PROTECTED_SPRINT_BRANCHES = "billing"

  # Email via Gmail SMTP relay. Password is a fly secret.
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "587"
  SMTP_TLS = "starttls"
  SMTP_USERNAME = "jamshid.swe@gmail.com"
  RESEND_FROM_EMAIL = "jamshid.swe@gmail.com"
  # smtp.gmail.com rejects the default "localhost" EHLO from a public source.
  SMTP_EHLO_NAME = "sd-agora-backend.fly.dev"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048"

[[restart]]
  policy = "always"
