# yaml-language-server: $schema=https://json.schemastore.org/render.json

# Agora deployment for desktop + backend, with a lightweight public web entry
# point for browser login and desktop downloads. Docs, daemon, and Telegram
# Mini App services are not provisioned.

previews:
  generation: off

services:
  - type: web
    name: agora-backend
    runtime: docker
    branch: master
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: agora-uploads
      mountPath: /app/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Seal remote MCP authorization headers at rest. Agent mcp_config keeps
      # only non-secret server metadata and blank header placeholders.
      - key: AGORA_MCP_SECRET_KEY
        generateValue: true
      # Seal per-workspace source-control PATs used for private clones and the
      # claim-time GitLab pipeline MCP. Existing values are preserved on sync.
      - key: AGORA_GIT_SECRET_KEY
        generateValue: true
      # Seal per-workspace Figma PATs. The backend injects the token only into
      # Figma-linked agent tasks; it never lives in workspace or agent JSON.
      - key: AGORA_FIGMA_SECRET_KEY
        generateValue: true
      # Personal realtime mirror: every Bitrix task assigned to Jamshid across
      # all sprints/workgroups. Bitrix stays source of truth. The inbound REST
      # webhook URL contains a credential and must be entered in Render; never
      # commit it. The responsible-user allowlist below is the fail-closed data
      # boundary: every other Bitrix user's task is rejected before routing.
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: BITRIX_INBOUND_SECRET
        generateValue: true
      - key: BITRIX_WEBHOOK_PUBLIC_URL
        value: https://agora-web-7mav.onrender.com
      - key: BITRIX_SYNC_WORKSPACE_SLUG
        value: sales-doctor
      - key: BITRIX_TARGET_PROJECT
        value: Bitrix
      - key: BITRIX_SYNC_USER_EMAILS
        value: j.tulaaganov@salesdoc.io
      - key: BITRIX_PROVISION_ASSIGNEES
        value: "true"
      # Webhooks provide real-time sync; polling reconciles missed deliveries.
      - key: BITRIX_SYNC_POLL_INTERVAL
        value: 5m
      - key: AGORA_BITRIX_USER_POLL_INTERVAL
        value: 5m
      # Bitrix owns task state. Only Jamshid-authored comments/files mirror
      # outbound; agent and system activity stays private inside Agora.
      - key: BITRIX_PUSH_STATUS
        value: "false"
      - key: BITRIX_PUSH_SYSTEM_COMMENTS
        value: "false"
      - key: BITRIX_PUSH_HUMAN_COMMENTS
        value: "true"
      - key: BITRIX_OUTBOUND_USER_EMAIL
        value: j.tulaaganov@salesdoc.io
      - key: AGORA_BITRIX_BULK_IMPORT
        # Fail-closed to the email allowlist above; owner/admin only. Operator
        # UI for the initial/manual personal import.
        value: "true"
      - key: APP_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "true"
      # Public auth is email-only. The shared UI does not expose social login,
      # and the backend must leave email-code endpoints enabled.
      - key: AGORA_TELEGRAM_ONLY
        value: "false"
      # ZeptoMail SMTP delivers login codes and invitation links. The password
      # is Agent-specific and must be entered in Render, never committed.
      - key: SMTP_HOST
        value: smtp.zeptomail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: emailapikey
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: starttls
      - key: SMTP_TLS_INSECURE
        value: "false"
      - key: RESEND_FROM_EMAIL
        value: noreply@tsst.ai
      # The platform bot remains available for inbox and agent integrations;
      # it is no longer presented as a sign-in method.
      - key: AGORA_TELEGRAM_SHARED_LOGIN_STORE
        value: "true"
      # Telegram bot OTP login for desktop. Create the bot with @BotFather.
      # The username is public (without @); token and webhook secret stay secret.
      - key: TELEGRAM_BOT_USERNAME
        value: agora_ai_pm_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_URL
        value: https://agora-web-7mav.onrender.com
      # Keep browser, desktop, and Telegram callback traffic on the same public
      # origin so the web proxy routes every login step to one backend service.
      - key: FRONTEND_ORIGIN
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_APP_URL
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_PUBLIC_URL
        value: https://agora-web-7mav.onrender.com

  - type: web
    name: agora-web
    runtime: docker
    branch: master
    region: frankfurt
    # The landing/download site can sleep when idle; keep the paid instance on
    # the stateful backend where it matters.
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Keep browser requests same-origin so /auth and /api always pass through
      # the Next.js proxy. Render preserves omitted variables on existing
      # services, so explicitly clear any stale direct-backend override that
      # would otherwise keep producing login 404s.
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_WS_URL
        value: ""
      # Dockerfile.web consumes these as build args. Render exposes service
      # env vars as Docker build args as well as runtime environment variables.
      - key: REMOTE_API_URL
        value: ""
      - key: REMOTE_API_HOSTPORT
        fromService:
          type: web
          name: agora-backend
          property: hostport
      # Docs are intentionally not deployed in this topology.
      - key: DOCS_URL
        value: http://127.0.0.1:4000

databases:
  - name: agora-db
    databaseName: agora
    user: agora
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "17"
    ipAllowList: []
    connectionPool: none
