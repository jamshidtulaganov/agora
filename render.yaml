# yaml-language-server: $schema=https://json.schemastore.org/render.json

# Agora deployment for desktop + backend, with a lightweight public web entry
# point for browser login and desktop downloads. Docs, daemon, and Telegram
# Mini App services are not provisioned.

previews:
  generation: off

services:
  - type: web
    name: agora-backend
    runtime: docker
    branch: master
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: agora-uploads
      mountPath: /app/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "true"
      # Keep email OTP and Google OAuth visible in the desktop login screen.
      - key: AGORA_TELEGRAM_ONLY
        value: "false"
      # Gmail SMTP for email verification codes. Enter the Gmail address,
      # an app password, and the sender address during Blueprint creation.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMTP_EHLO_NAME
        sync: false
      # Telegram bot OTP login for desktop. Create the bot with @BotFather.
      # The username is public (without @); token and webhook secret stay secret.
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # Google OAuth web-client credentials. GOOGLE_REDIRECT_URI must be the
      # backend callback URL:
      # https://<actual-render-host>/auth/google/desktop/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Enter the public backend URL shown by Render, with no trailing slash.
      # Use the same value for all three variables, for example:
      # https://agora-backend.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AGORA_APP_URL
        sync: false
      - key: AGORA_PUBLIC_URL
        sync: false

  - type: web
    name: agora-web
    runtime: docker
    branch: master
    region: frankfurt
    # The landing/download site can sleep when idle; keep the paid instance on
    # the stateful backend where it matters.
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Keep browser requests same-origin so /auth and /api always pass through
      # the Next.js proxy. Render preserves omitted variables on existing
      # services, so explicitly clear any stale direct-backend override that
      # would otherwise keep producing login 404s.
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_WS_URL
        value: ""
      # Dockerfile.web consumes these as build args. Render exposes service
      # env vars as Docker build args as well as runtime environment variables.
      - key: REMOTE_API_URL
        value: ""
      - key: REMOTE_API_HOSTPORT
        fromService:
          type: web
          name: agora-backend
          property: hostport
      # Docs are intentionally not deployed in this topology.
      - key: DOCS_URL
        value: http://127.0.0.1:4000

databases:
  - name: agora-db
    databaseName: agora
    user: agora
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "17"
    ipAllowList: []
    connectionPool: none
