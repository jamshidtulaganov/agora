# yaml-language-server: $schema=https://json.schemastore.org/render.json

# Desktop deployment: the Electron app connects directly to the public backend.
# Optional web, docs, daemon, and Telegram Mini App services are not provisioned.

previews:
  generation: off

services:
  - type: web
    name: agora-backend
    runtime: docker
    branch: master
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: agora-uploads
      mountPath: /app/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "true"
      # Enter the public backend URL shown by Render, with no trailing slash.
      # Use the same value for all three variables, for example:
      # https://agora-backend.onrender.com
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AGORA_APP_URL
        sync: false
      - key: AGORA_PUBLIC_URL
        sync: false

databases:
  - name: agora-db
    databaseName: agora
    user: agora
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "17"
    ipAllowList: []
    connectionPool: none
