# yaml-language-server: $schema=https://json.schemastore.org/render.json

# Agora deployment for desktop + backend, with a lightweight public web entry
# point for browser login and desktop downloads and an always-on Claude agent
# worker. Docs and Telegram Mini App services are not provisioned.

previews:
  generation: off

services:
  - type: web
    name: agora-backend
    runtime: docker
    branch: master
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: agora-uploads
      mountPath: /app/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Seal remote MCP authorization headers at rest. Agent mcp_config keeps
      # only non-secret server metadata and blank header placeholders.
      - key: AGORA_MCP_SECRET_KEY
        generateValue: true
      # Seal per-workspace source-control PATs used for private clones and the
      # claim-time GitLab pipeline MCP. Existing values are preserved on sync.
      - key: AGORA_GIT_SECRET_KEY
        generateValue: true
      # Seal per-agent Telegram bot tokens at rest. This key must remain stable:
      # rotating it makes already-installed bot tokens unreadable. The live
      # value is managed in Render and must never be committed.
      - key: AGORA_TELEGRAM_SECRET_KEY
        sync: false
      # Seal per-workspace Figma PATs. The backend injects the token only into
      # Figma-linked agent tasks; it never lives in workspace or agent JSON.
      - key: AGORA_FIGMA_SECRET_KEY
        generateValue: true
      # Personal realtime mirror: every Bitrix task assigned to Jamshid across
      # all sprints/workgroups. Bitrix stays source of truth. The inbound REST
      # webhook URL contains a credential and must be entered in Render; never
      # commit it. The responsible-user allowlist below is the fail-closed data
      # boundary: every other Bitrix user's task is rejected before routing.
      - key: BITRIX_WEBHOOK_URL
        sync: false
      - key: BITRIX_INBOUND_SECRET
        generateValue: true
      - key: BITRIX_WEBHOOK_PUBLIC_URL
        value: https://agora-web-7mav.onrender.com
      - key: BITRIX_SYNC_WORKSPACE_SLUG
        value: sales-doctor
      - key: BITRIX_TARGET_PROJECT
        value: Bitrix
      # Bitrix portal EMAILs (note "tulaganov" with one "a", and "tojiyev" —
      # both differ from the Agora logins). Jamshid mirrors in full; Shaxzod
      # (Bitrix 527, frontend teammate, 79 open tasks) is stage-restricted below
      # so only the columns Jamshid actually reviews cross into Agora.
      - key: BITRIX_SYNC_USER_EMAILS
        value: j.tulaganov@salesdoc.io,s.tojiyev@salesdoc.io
      # Per-user column allowlist, keyed by LOWERCASED stage name. Every spelling
      # in use across the sprint groups must be listed — the match is exact, and
      # the boards mix "Need Merge"/"Need merge" and carry the typo "Ready fo
      # release" (149). Names collide across groups once lowercased, so one entry
      # covers the same column in every sprint.
      - key: BITRIX_SYNC_USER_STAGE_RULES
        value: '{"s.tojiyev@salesdoc.io":["code review","in code review","review","need merge","нужен merge"]}'
      # Squad that owns stage-restricted review work (Shaxzod's tasks land here
      # instead of on him, so the agent review flow picks them up). This is the
      # "Shaxzod Code Review" squad in the sales-doctor workspace. Not a secret —
      # an internal row id — so it lives here rather than in the dashboard, which
      # keeps the blueprint reproducible.
      - key: BITRIX_REVIEW_SQUAD_ID
        value: 9b2c64b6-9167-49bd-b0b4-302c2ee60e3e
      - key: BITRIX_PROVISION_ASSIGNEES
        value: "true"
      # Webhooks provide real-time sync; polling reconciles missed deliveries.
      - key: BITRIX_SYNC_POLL_INTERVAL
        value: 5m
      - key: AGORA_BITRIX_USER_POLL_INTERVAL
        value: 5m
      # Only current work crosses into Agora: tasks created or changed in the
      # last 30 days. Deliberately a rolling window rather than a sprint-group
      # allowlist — the portal opens a new sprint group every couple of weeks
      # (Спринт 12 / Sprint(12) / Спринт (13) / Спринт (14)), so a fixed list
      # stops importing the sprint the team just moved to. Tasks that age out are
      # ARCHIVED, not deleted, and unarchive if they get activity again.
      - key: AGORA_BITRIX_IMPORT_WINDOW_DAYS
        value: "30"
      # Status is now two-way: an Agora status change moves the linked task's
      # kanban COLUMN (and aligns coarse STATUS) on the portal. This writes into
      # shared team sprint boards, including for agent-driven status changes.
      # It is in the config registry, so Settings → Configs → Bitrix is the
      # instant kill switch — no redeploy needed to turn it back off.
      # Only Jamshid-authored comments/files mirror outbound; agent and system
      # activity stays private inside Agora.
      - key: BITRIX_PUSH_STATUS
        value: "true"
      - key: BITRIX_PUSH_SYSTEM_COMMENTS
        value: "false"
      - key: BITRIX_PUSH_HUMAN_COMMENTS
        value: "true"
      # Agora account email for outbound gate (may differ from Bitrix EMAIL).
      - key: BITRIX_OUTBOUND_USER_EMAIL
        value: jamshid.swe@gmail.com
      - key: AGORA_BITRIX_BULK_IMPORT
        # Fail-closed to the email allowlist above; owner/admin only. Operator
        # UI for the initial/manual personal import.
        value: "true"
      - key: APP_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "true"
      # Public auth is email-only. The shared UI does not expose social login,
      # and the backend must leave email-code endpoints enabled.
      - key: AGORA_TELEGRAM_ONLY
        value: "false"
      # ZeptoMail SMTP delivers login codes and invitation links. The password
      # is Agent-specific and must be entered in Render, never committed.
      - key: SMTP_HOST
        value: smtp.zeptomail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: emailapikey
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: starttls
      - key: SMTP_TLS_INSECURE
        value: "false"
      - key: RESEND_FROM_EMAIL
        value: noreply@tsst.ai
      # The platform bot remains available for inbox and agent integrations;
      # it is no longer presented as a sign-in method.
      - key: AGORA_TELEGRAM_SHARED_LOGIN_STORE
        value: "true"
      # Telegram bot OTP login for desktop. Create the bot with @BotFather.
      # The username is public (without @); token and webhook secret stay secret.
      - key: TELEGRAM_BOT_USERNAME
        value: agora_ai_pm_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_URL
        value: https://agora-web-7mav.onrender.com
      # Keep browser, desktop, and Telegram callback traffic on the same public
      # origin so the web proxy routes every login step to one backend service.
      - key: FRONTEND_ORIGIN
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_APP_URL
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_PUBLIC_URL
        value: https://agora-web-7mav.onrender.com

  - type: web
    name: agora-web
    runtime: docker
    branch: master
    region: frankfurt
    # The landing/download site can sleep when idle; keep the paid instance on
    # the stateful backend where it matters.
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Keep browser requests same-origin so /auth and /api always pass through
      # the Next.js proxy. Render preserves omitted variables on existing
      # services, so explicitly clear any stale direct-backend override that
      # would otherwise keep producing login 404s.
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_WS_URL
        value: ""
      # Dockerfile.web consumes these as build args. Render exposes service
      # env vars as Docker build args as well as runtime environment variables.
      - key: REMOTE_API_URL
        value: ""
      - key: REMOTE_API_HOSTPORT
        fromService:
          type: web
          name: agora-backend
          property: hostport
      # Docs are intentionally not deployed in this topology.
      - key: DOCS_URL
        value: http://127.0.0.1:4000

  # Outbound-only worker: claims Agora tasks and executes them with Claude Code
  # or Cursor Agent even when every developer laptop is offline. HOME and all
  # worktrees live on the persistent disk so daemon identity and repository
  # clones survive deploys.
  - type: worker
    name: agora-daemon-claude
    runtime: docker
    repo: https://github.com/jamshidtulaganov/agora
    branch: master
    region: frankfurt
    # Claude plus repository builds need more headroom than Starter's 512 MB.
    plan: pro
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.daemon
    dockerContext: .
    disk:
      name: agora-daemon-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: AGORA_PAT
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: CURSOR_API_KEY
        sync: false
      - key: AGORA_SERVER_URL
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_APP_URL
        value: https://agora-web-7mav.onrender.com
      - key: AGORA_WORKSPACES_ROOT
        value: /data/workspaces
      - key: AGORA_DAEMON_DEVICE_NAME
        value: Render 24/7
      - key: AGORA_AGENT_RUNTIME_NAME
        value: Claude Render 24/7
      - key: AGORA_DAEMON_MAX_CONCURRENT_TASKS
        value: "2"
      - key: AGORA_DAEMON_AUTO_UPDATE
        value: "false"

databases:
  - name: agora-db
    databaseName: agora
    user: agora
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "17"
    ipAllowList: []
    connectionPool: none
